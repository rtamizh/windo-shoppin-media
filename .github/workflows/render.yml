name: Render slides
on:
  push:
    paths: ['posts/**/slides.html', 'render.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Poppins font and ffmpeg
        run: |
          mkdir -p ~/.fonts
          for w in Medium SemiBold Bold ExtraBold; do
            curl -fsSL -o ~/.fonts/Poppins-$w.ttf https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-$w.ttf
          done
          fc-cache -f
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install Python packages
        run: pip install playwright pillow
      - name: Render
        run: python render.py
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add posts
          if ! git diff --cached --quiet; then git commit -m "Render slides"; git push; fi
